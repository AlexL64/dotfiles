# Player
border=no
keep-open=yes
snap-window=yes
autofit=85%x85%
cursor-autohide=1000
audio-pitch-correction=yes
save-position-on-quit=yes
watch-later-options-remove=sub-pos
fullscreen=no

# Audio
alang=jpn,jp,fre,fr,eng,en
volume=80
volume-max=120
mute=no
audio-file-auto=fuzzy               # Load additional audio files containing the video filename
audio-channels=stereo

# Subs
sub-font=Noto Sans
sub-bold=no
sub-font-size=42
sub-blur=1
sub-auto=fuzzy                      # Load additional subtitle files containing the video filename
demuxer-mkv-subtitle-preroll=yes    # Try to correctly show embedded subs when seeking
sub-margin-y=40
stretch-image-subs-to-screen=yes
slang=fre,fr,eng,en                        # Prioritize which subtitles language to use
sub-pos=100

# Terminal
msg-color=yes
msg-module=yes

#Lazy quality profile which sets some recommended settings
profile=gpu-hq
vo=gpu-next
hwdec=auto-copy-safe
pause=yes