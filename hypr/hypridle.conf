general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 150
    on-timeout = if [ $(brightnessctl --device=intel_backlight g) -ge 60 ]; then brightnessctl --device=intel_backlight -s set 5%; fi
    on-resume = if [ $(brightnessctl --device=intel_backlight g) -le 60 ]; then brightnessctl --device=intel_backlight -r; fi
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 600
    on-timeout = systemctl suspend
}