$mainMod = SUPER

# General
bindd = $mainMod, L, "General" "SUPER+L" "Lock", exec, hyprlock
bindd = $mainMod, B, "General" "SUPER+B" "Toggle bar", exec, ags toggle bar-0
bindd = $mainMod, backspace, "General" "SUPER+BACKSPACE" "Power menu", exec, ags toggle power_selector
bindd = $mainMod SHIFT, S, "General" "SUPER+SHIFT+S" "Screenshot", exec, ags toggle screenshot

# Programs
bindd = $mainMod, Q, "Program" "SUPER+Q" "Terminal", exec, kitty
bindd = $mainMod, E, "Program" "SUPER+E" "File manager", exec, thunar

# Window Management
bindd = $mainMod, C, "Window Management" "SUPER+C" "Close active window", killactive
bindd = $mainMod, SPACE, "Window Management" "SUPER+SPACE" "Toggle window floating", togglefloating,
bindd = $mainMod, F, "Window Management" "SUPER+F" "Full screen window", fullscreen, 0
bindd = $mainMod, M, "Window Management" "SUPER+M" "Maximize window", fullscreen, 1
bindd = $mainMod, J, "Window Management" "SUPER+J" "Switch windows split direction", togglesplit
bindd = $mainMod, K, "Window Management" "SUPER+K" "Toggle window pseudo mode", pseudo

# Move Window Focus
bindd = $mainMod, left, "Move Window Focus" "SUPER+LEFT" "Move window focus left", movefocus, l
bindd = $mainMod, right, "Move Window Focus" "SUPER+RIGHT" "Move window focus right", movefocus, r
bindd = $mainMod, up, "Move Window Focus" "SUPER+UP" "Move window focus up", movefocus, u
bindd = $mainMod, down, "Move Window Focus" "SUPER+DOWN" "Move window focus down", movefocus, d

# Move Window
bindd = $mainMod SHIFT, left, "Move Window" "SUPER+SHIFT+LEFT" "Move window left", swapwindow, l
bindd = $mainMod SHIFT, right, "Move Window" "SUPER+SHIFT+RIGHT" "Move window right", swapwindow, r
bindd = $mainMod SHIFT, up, "Move Window" "SUPER+SHIFT+UP" "Move window up", swapwindow, u
bindd = $mainMod SHIFT, down, "Move Window" "SUPER+SHIFT+DOWN" "Move window down", swapwindow, d

# Resize Window
binded = CTRL, right, "Resize Window" "CTRL+RIGHT" "Icrease window horizontal size", resizeactive, 25 0
binded = CTRL, left, "Resize Window" "CTRL+LEFT" "Decrease window horizontal size", resizeactive, -25 0
binded = CTRL, up, "Resize Window" "CTRL+UP" "Icrease window vertical size", resizeactive, 0 -25
binded = CTRL, down, "Resize Window" "CTRL+DOWN" "Decrease window vertical size", resizeactive, 0 25

# Workspace
bindd = $mainMod, S, "Workspace" "SUPER+S" "Open special workspace", togglespecialworkspace, magic

# Switch Workspace
bindd = $mainMod, mouse_down, "Switch Workspace" "SUPER+MOUSE_DOWN" "Swicth workspace down", workspace, e-1
bindd = $mainMod, mouse_up, "Switch Workspace" "SUPER+MOUSE_UP" "Swicth workspace up", workspace, e+1
bindd = $mainMod, code:10, "Switch Workspace" "SUPER+1" "Switch to workspace 1", split:workspace, 1
bindd = $mainMod, code:11, "Switch Workspace" "SUPER+2" "Switch to workspace 2", split:workspace, 2
bindd = $mainMod, code:12, "Switch Workspace" "SUPER+3" "Switch to workspace 3", split:workspace, 3
bindd = $mainMod, code:13, "Switch Workspace" "SUPER+4" "Switch to workspace 4", split:workspace, 4
bindd = $mainMod, code:14, "Switch Workspace" "SUPER+5" "Switch to workspace 5", split:workspace, 5
bindd = $mainMod, code:15, "Switch Workspace" "SUPER+6" "Switch to workspace 6", split:workspace, 6
bindd = $mainMod, code:16, "Switch Workspace" "SUPER+7" "Switch to workspace 7", split:workspace, 7
bindd = $mainMod, code:17, "Switch Workspace" "SUPER+8" "Switch to workspace 8", split:workspace, 8
bindd = $mainMod, code:18, "Switch Workspace" "SUPER+9" "Switch to workspace 9", split:workspace, 9

# Move Window To Workspace
bindd = $mainMod SHIFT, code:10, "Move Window To Workspace" "SUPER+SHIFT+1" "Move window to worksapce 1", split:movetoworkspace, 1
bindd = $mainMod SHIFT, code:11, "Move Window To Workspace" "SUPER+SHIFT+2" "Move window to worksapce 2", split:movetoworkspace, 2
bindd = $mainMod SHIFT, code:12, "Move Window To Workspace" "SUPER+SHIFT+3" "Move window to worksapce 3", split:movetoworkspace, 3
bindd = $mainMod SHIFT, code:13, "Move Window To Workspace" "SUPER+SHIFT+4" "Move window to worksapce 4", split:movetoworkspace, 4
bindd = $mainMod SHIFT, code:14, "Move Window To Workspace" "SUPER+SHIFT+5" "Move window to worksapce 5", split:movetoworkspace, 5
bindd = $mainMod SHIFT, code:15, "Move Window To Workspace" "SUPER+SHIFT+6" "Move window to worksapce 6", split:movetoworkspace, 6
bindd = $mainMod SHIFT, code:16, "Move Window To Workspace" "SUPER+SHIFT+7" "Move window to worksapce 7", split:movetoworkspace, 7
bindd = $mainMod SHIFT, code:17, "Move Window To Workspace" "SUPER+SHIFT+8" "Move window to worksapce 8", split:movetoworkspace, 8
bindd = $mainMod SHIFT, code:18, "Move Window To Workspace" "SUPER+SHIFT+9" "Move window to worksapce 9", split:movetoworkspace, 9

# Multi Monitor
bindd = $mainMod SHIFT, P, "Multi Monitor" "SUPER+SHIFT+P" "Second monitor config", exec, $HOME/.config/hypr/scripts/monitor_config.sh
bindd = SUPER, O, "Multi Monitor" "SUPER+O" "Focus next monitor", focusmonitor, +1
bindd = SUPER SHIFT, O, "Multi Monitor" "SUPER+SHIFT+O" "Move window to next monitor", movewindow, mon:+1
bindd = SUPER CONTROL, O, "Multi Monitor" "SUPER+CTRL+O" "Swap active worksapce", split:swapactiveworkspaces, current +1
bindd = SUPER, G, "Multi Monitor" "SUPER+G" "Grab rogue windows", split:grabroguewindows

# Tools
bindd = $mainMod, R, "Tools" "SUPER+R" "Run menu", exec, rofi -show run -theme $HOME/.config/rofi/themes/style.rasi
bindd = $mainMod, W, "Tools" "SUPER+R" "Wallpaper selector", exec, $HOME/.config/hypr/scripts/wallpaper_selector.sh
bindd = $mainMod, V, "Tools" "SUPER+V" "Clipboard", exec, ags toggle Clipboard
bindd = $mainMod, P, "Tools" "SUPER+P" "App launcher", exec, ags toggle AppLauncher
bindd = $mainMod, twosuperior, "Tools" "SUPER+²" "This window", exec, ags toggle keybinds

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Brightness control
bind = , XF86MonBrightnessDown, exec, brightnessctl s 5%- --device=intel_backlight
bind = , XF86MonBrightnessUp, exec, brightnessctl s +5% --device=intel_backlight

# Volume/Mic Control
bind = , XF86AudioMute, exec, pactl set-sink-mute 0 toggle
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume 0 -5%
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume 0 +5%
bind = , XF86AudioMicMute, exec, pactl set-source-mute 0 toggle

# Media control
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioStop, exec, playerctl stop
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Open calculator
bind = , XF86Calculator, exec, qalculate-gtk
